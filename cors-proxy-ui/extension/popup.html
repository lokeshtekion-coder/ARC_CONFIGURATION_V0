<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARC Helper</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="bg-orb orb-1"></div>
      <div class="bg-orb orb-2"></div>

      <header class="hero">
        <div class="brand-row">
          <div class="brand-badge">A</div>
          <div>
            <h1>ARC Helper</h1>
            <p class="subtitle">Chrome Extension Status</p>
          </div>
        </div>
        <div class="version-chip" id="versionChip">v--</div>
      </header>

      <main class="content">
        <section class="card status-card">
          <div class="card-header">
            <span class="card-title">Connection Status</span>
            <span class="pulse" id="pulseDot"></span>
          </div>

          <div class="status-grid">
            <div class="status-item">
              <div class="label">Extension</div>
              <div class="value ok" id="extensionStatus">Loaded</div>
            </div>

            <div class="status-item">
              <div class="label">ARC App</div>
              <div class="value" id="appStatus">Checking...</div>
            </div>

            <div class="status-item full">
              <div class="label">Detected URL</div>
              <div class="value mono small" id="detectedUrl">—</div>
            </div>

            <div class="status-item full">
              <div class="label">Last Checked</div>
              <div class="value small" id="lastChecked">—</div>
            </div>
          </div>
        </section>

        <section class="card info-card">
          <div class="card-header">
            <span class="card-title">Watch Custom API</span>
          </div>

          <div style="display: grid; gap: 10px;">
            <input
              id="customUrlInput"
              type="text"
              placeholder="Enter full URL or partial endpoint path"
              class="popup-input"
            />

            <div style="display: grid; grid-template-columns: 1fr 120px; gap: 8px;">
              <select id="customMatchMode" class="popup-input">
                <option value="includes">Match: Contains</option>
                <option value="exact">Match: Exact URL</option>
              </select>

              <input
                id="customExpiryInput"
                type="number"
                min="1"
                step="1"
                value="48"
                placeholder="Expiry hours"
                class="popup-input"
              />
            </div>

            <input
              id="customLabelInput"
              type="text"
              placeholder="Optional label, e.g. Approval Tenants API"
              class="popup-input"
            />

            <button class="btn btn-primary" id="addUrlBtn">Add Watched API</button>

            <div>
              <div class="label" style="margin-bottom: 8px;">Watched APIs</div>
              <div id="watchedUrlsList" style="display: grid; gap: 8px;"></div>
            </div>
          </div>
        </section>

        <section class="card info-card">
          <div class="card-header">
            <span class="card-title">About</span>
          </div>
          <p class="info-text">
            This popup shows whether your local ARC app is open and whether the extension is active.
          </p>
        </section>

        <div class="actions">
          <button class="btn btn-primary" id="openAppBtn">Open ARC App</button>
          <button class="btn btn-secondary" id="refreshBtn">Refresh Status</button>
        </div>
      </main>
    </div>

    <script type="module" src="./dist/popup.js"></script>
  </body>
</html>
